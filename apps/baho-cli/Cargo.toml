[package]
name = "baho-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "baho"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
baho-core = { path = "../../crates/baho-core" }
baho-model = { path = "../../crates/baho-model" }
baho-run = { path = "../../crates/baho-run" }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
assert_cmd = "2.0"
serde_json = "1.0"
tempfile = "3.10"
