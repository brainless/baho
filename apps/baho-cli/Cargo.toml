[package]
name = "baho-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "baho"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
baho-core = { path = "../../crates/baho-core" }
baho-model = { path = "../../crates/baho-model" }
baho-plan = { path = "../../crates/baho-plan" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.10"
