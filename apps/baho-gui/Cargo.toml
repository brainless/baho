[package]
name = "baho-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "baho-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
baho-core = { path = "../../crates/baho-core" }
baho-model = { path = "../../crates/baho-model" }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"

# Keep the pre-alpha presentation dependency inside this application. The
# revision is pinned because akar's Rust API is not yet a stable release.
akar-components = { git = "https://github.com/brainless/akar", rev = "16755a8c1d9a66e7c3346ae5602167f7cf7cda78" }
akar-core = { git = "https://github.com/brainless/akar", rev = "16755a8c1d9a66e7c3346ae5602167f7cf7cda78", features = ["serde"] }
akar-layout = { git = "https://github.com/brainless/akar", rev = "16755a8c1d9a66e7c3346ae5602167f7cf7cda78" }
akar-winit = { git = "https://github.com/brainless/akar", rev = "16755a8c1d9a66e7c3346ae5602167f7cf7cda78" }
pollster = "0.4"
png = "0.17"
serde_json = "1"
wgpu = "29"
winit = "0.30"

[dev-dependencies]
tempfile = "3.10"
