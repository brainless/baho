name: Build binaries

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.binary }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: baho-cli
            binary: baho
            runner: macos-15
            target: aarch64-apple-darwin
          - package: baho-gui
            binary: baho-gui
            runner: macos-15
            target: aarch64-apple-darwin
          - package: baho-cli
            binary: baho
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - package: baho-gui
            binary: baho-gui
            runner: macos-15-intel
            target: x86_64-apple-darwin
    steps:
      - name: Validate release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Expected a tag in vX.Y.Z format" >&2
            exit 1
          }
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --locked --release -p ${{ matrix.package }} --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/${{ matrix.binary }}-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
