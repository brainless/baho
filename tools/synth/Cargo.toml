[package]
name = "synth"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
rig = "=0.43.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
sha2 = "0.10"
syn = { version = "3", default-features = false, features = ["full", "parsing", "printing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"
rig = { version = "=0.43.0", features = ["test-utils"] }

[profile.dev]
debug = false
