[package]
name = "baho-run"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
baho-core = { path = "../baho-core" }
baho-model = { path = "../baho-model" }
baho-plan = { path = "../baho-plan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
